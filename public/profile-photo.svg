<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7" />
      <stop offset="100%" style="stop-color:#bbf7d0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a" />
      <stop offset="100%" style="stop-color:#15803d" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="170" />
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />

  <!-- Decorative dots pattern -->
  <g opacity="0.15">
    <circle cx="50" cy="80" r="4" fill="#16a34a" />
    <circle cx="350" cy="60" r="6" fill="#16a34a" />
    <circle cx="320" cy="350" r="5" fill="#16a34a" />
    <circle cx="60" cy="340" r="3" fill="#16a34a" />
    <circle cx="370" cy="200" r="4" fill="#16a34a" />
    <circle cx="30" cy="200" r="3" fill="#16a34a" />
  </g>

  <!-- Clipped avatar content -->
  <g clip-path="url(#circleClip)">
    <!-- Shoulders/body -->
    <path d="M 200 400 Q 100 400 80 320 Q 80 270 130 250 Q 165 240 200 240 Q 235 240 270 250 Q 320 270 320 320 Q 320 400 200 400 Z" fill="url(#avatarGrad)" />

    <!-- Neck -->
    <rect x="180" y="210" width="40" height="50" rx="15" fill="#e8b4a0" />

    <!-- Head -->
    <ellipse cx="200" cy="160" rx="65" ry="75" fill="#f5c4a1" />

    <!-- Hair - top -->
    <path d="M 135 160 Q 130 90 200 80 Q 270 90 265 160 Q 265 130 250 115 Q 230 95 200 92 Q 170 95 150 115 Q 135 130 135 160 Z" fill="#2d1810" />

    <!-- Hair sides -->
    <path d="M 135 160 Q 130 175 135 185 Q 140 170 142 160 Z" fill="#2d1810" />
    <path d="M 265 160 Q 270 175 265 185 Q 260 170 258 160 Z" fill="#2d1810" />

    <!-- Eyes -->
    <ellipse cx="175" cy="160" rx="8" ry="5" fill="#3d2817" />
    <ellipse cx="225" cy="160" rx="8" ry="5" fill="#3d2817" />
    <circle cx="177" cy="158" r="2" fill="#fff" opacity="0.8" />
    <circle cx="227" cy="158" r="2" fill="#fff" opacity="0.8" />

    <!-- Eyebrows -->
    <path d="M 163 145 Q 175 140 187 145" stroke="#2d1810" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 213 145 Q 225 140 237 145" stroke="#2d1810" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 200 165 Q 197 180 195 190 Q 200 192 205 190 Q 203 180 200 165" fill="#e8a080" opacity="0.5" />

    <!-- Smile -->
    <path d="M 185 195 Q 200 208 215 195" stroke="#c66550" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Ears -->
    <ellipse cx="135" cy="165" rx="8" ry="14" fill="#f0b898" />
    <ellipse cx="265" cy="165" rx="8" ry="14" fill="#f0b898" />
  </g>

  <!-- Decorative ring -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 4" opacity="0.3" />
</svg>
